name: CI

# Required PR (and master) checks: lint, unit tests, and fixture e2e.
# Fixture e2e boots against docs/fixtures/ (engine stub + mini catalog) so a
# red build here means a regression in this repo — not an upstream outage on
# jandahl.github.io/api.oq.gl or the grammarian GitHub Pages mirror.
# Live upstream smoke is .github/workflows/live-smoke.yml (weekly, or
# workflow_dispatch). Do not add the full live suite to this job.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  # The image supplies Node, Chromium, and its system dependencies. Keep the
  # tag aligned with package-lock.json's @playwright/test version so CI does
  # not need a separate browser/apt installation job.
  checks:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
